# Capa 2 de 3 de la obligacion de testear (ver tests/README.md).
#
# Frena a cualquiera que commitee en local, y viaja en el clone. Requiere un
# paso manual una vez por maquina:
#
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# Limitacion honesta: se salta con `git commit --no-verify`. La unica capa que
# nadie puede saltarse es GitHub Actions (.github/workflows/tests.yml).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: require-tests
        name: codigo de la app sin tests
        entry: python .claude/hooks/require_tests.py --staged
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-unit
        name: pytest (solo unit, sin dispositivos)
        entry: python -m pytest -m unit -q
        language: system
        pass_filenames: false
        always_run: true
